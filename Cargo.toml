[package]
name = "rsrfc"
version = "0.1.0"
authors = ["Hans-Christian Esperer <hc@hcesperer.org>"]
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]
name = "rsrfc"
path = "src/lib.rs"

[[bin]]
name = "rsrfctest"
path = "src/main.rs"

[dependencies]
dlopen = "0.1.8"
dlopen_derive = "0.1.4"
widestring = "0.4.0"
log = "0.4.27"
