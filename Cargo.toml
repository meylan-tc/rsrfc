[package]
name = "rsrfc"
version = "0.1.0"
authors = ["Hans-Christian Esperer <hc@hcesperer.org>"]
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]
name = "rsrfc"
path = "src/lib.rs"

[[bin]]
name = "rsrfctest"
path = "src/main.rs"

[dependencies]
dlopen2 = { version = "0.8.2", default-features = false, features = ["wrapper", "symbor"] }
widestring = "^1.2.0"
log = "*"
